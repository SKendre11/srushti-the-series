<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Srushti — The Series</title>
    <meta name="description" content="Srushti Kendre — Computer Science Engineering Student &amp; Aspiring Full-Stack Developer. A cinematic, streaming-inspired portfolio." />
    <meta name="theme-color" content="#07070a" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="preload" as="image" href="/assets/portrait-720.webp" type="image/webp" />
    <script>
      // Restore saved theme on first paint to avoid flashing
      (function () {
        try {
          var t = localStorage.getItem('srushti-theme');
          // Default to light mode on first visit
          if (t === 'dark') {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Srushti Kendre — CSE Student &amp; Aspiring Full-Stack Developer. Please enable JavaScript to watch the series.</noscript>

  </body>
